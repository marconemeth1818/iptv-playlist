name: Aktualizácia playlistu

on:
  schedule:
      - cron: "17 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vytvor playlist
        run: python3 aktualizuj_playlist.py

      - name: Ulož zmeny
        run: |
          if [ "$(date +%d)" = "01" ]; then date -u > posledna_kontrola.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Bez zmien."
          else
            git commit -m "Aktualizácia playlistu $(date +%F)"
            git push
          fi
